android.useAndroidX=true
# enableJetifier removed: nothing here is a support-library artifact, and it slows builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Pin the build JDK. Without this, ./gradlew inherits whatever `java` is on PATH,
# which on this machine is Java 8 — AGP 8.x requires 17+. AGP 8.6 supports JDK 21.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
